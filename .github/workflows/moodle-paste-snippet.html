
<style>

.gmu-menu {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 8px;
  box-sizing: border-box;
}

/* ---------- the tile ---------- */
.gmu-menu__item {
  display: block;
  position: relative;
  margin: 0 0 14px;
  border-radius: 10px;
  overflow: hidden;
  line-height: 0;
  text-decoration: none;
  isolation: isolate;
  transform: translateZ(0);            /* stops edge flicker on scale */
  transition: transform .35s cubic-bezier(.2,.7,.3,1),
              box-shadow .35s cubic-bezier(.2,.7,.3,1);
  box-shadow: 0 1px 3px rgba(0,0,0,.14);
}

.gmu-menu__img {
  display: block;
  width: 100%;
  height: auto;
  border: 0;
  transition: transform .55s cubic-bezier(.2,.7,.3,1),
              filter .35s ease;
}

/* ---------- entrance: fade + rise, staggered ---------- */
@keyframes gmu-rise {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}
.gmu-menu__item {
  opacity: 0;
  animation: gmu-rise .6s cubic-bezier(.2,.7,.3,1) forwards;
}
.gmu-menu__item:nth-child(1) { animation-delay: .05s; }
.gmu-menu__item:nth-child(2) { animation-delay: .11s; }
.gmu-menu__item:nth-child(3) { animation-delay: .17s; }
.gmu-menu__item:nth-child(4) { animation-delay: .23s; }
.gmu-menu__item:nth-child(5) { animation-delay: .29s; }
.gmu-menu__item:nth-child(6) { animation-delay: .35s; }
.gmu-menu__item:nth-child(7) { animation-delay: .41s; }
.gmu-menu__item:nth-child(8) { animation-delay: .47s; }
.gmu-menu__item:nth-child(9) { animation-delay: .53s; }

/* ---------- hover / focus: lift, zoom, glow ---------- */
@media (hover: hover) {
  .gmu-menu__item:hover {
    transform: translateY(-5px);
    box-shadow: 0 14px 30px rgba(0,0,0,.28);
  }
  .gmu-menu__item:hover .gmu-menu__img {
    transform: scale(1.045);
    filter: saturate(1.12) brightness(1.05);
  }
}

/* ---------- highlight ring ---------- */
.gmu-menu__item::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  border: 2px solid rgba(255,255,255,.85);
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
  z-index: 2;
}
.gmu-menu__item:hover::before,
.gmu-menu__item:focus-visible::before { opacity: 1; }

/* ---------- shine sweep ---------- */
.gmu-menu__item::after {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: -60%;
  width: 45%;
  pointer-events: none;
  z-index: 1;
  background: linear-gradient(100deg,
              rgba(255,255,255,0) 0%,
              rgba(255,255,255,.38) 50%,
              rgba(255,255,255,0) 100%);
  transform: skewX(-18deg);
  opacity: 0;
}
@media (hover: hover) {
  .gmu-menu__item:hover::after {
    opacity: 1;
    animation: gmu-sweep .85s cubic-bezier(.25,.6,.3,1);
  }
}
@keyframes gmu-sweep {
  from { left: -60%; }
  to   { left: 115%; }
}

/* ---------- keyboard focus ---------- */
.gmu-menu__item:focus-visible {
  outline: 3px solid #7b2ff7;
  outline-offset: 3px;
}

/* =========================================================
   ORIENTATION / DEVICE ADAPTATION

   The banners are 4:1 with the college name baked into the
   LEFT third. Shown whole on a phone that name renders about
   11px tall and is unreadable. So on narrow portrait screens
   we crop the banner from the right and anchor left: the tile
   gets taller, the title gets bigger, the decorative photo and
   crest give up the space. Landscape and tablet+ keep the
   full 4:1 artwork exactly as designed.
   ========================================================= */

   How far we may crop is NOT a taste decision - it is measured.
   Measured across all 9 banners, the longest baked-in title
   ("...FOREIGN LANGUAGE PROGRAM") ends at 58.6% of banner width.
   With object-fit:cover the visible fraction is:

       visible = container-aspect / 4        (4 = banner aspect)

   so container-aspect must stay above 4 x 0.59 = 2.36 or the college
   name gets sliced off. 13/5 (=2.6) shows 65% - a 6.4-point safety
   margin. Do not lower these ratios without re-measuring. */

/* phone, portrait - strongest crop that still clears the titles */
@media (max-width: 430px) and (orientation: portrait) {
  .gmu-menu__img {
    aspect-ratio: 13 / 5;              /* shows 65% - title safe */
    object-fit: cover;
    object-position: left center;
  }
  /* !important: the inline fallback styles would otherwise win */
  .gmu-menu__item {
    margin-bottom: 10px !important;
    border-radius: 8px !important;
  }
}

/* large phone / small tablet, portrait - gentler crop */
@media (min-width: 431px) and (max-width: 780px) and (orientation: portrait) {
  .gmu-menu__img {
    aspect-ratio: 16 / 5;              /* shows 80% */
    object-fit: cover;
    object-position: left center;
  }
}

/* any phone in landscape - full artwork, it fits */
@media (max-height: 500px) and (orientation: landscape) {
  .gmu-menu__img {
    aspect-ratio: auto;
    object-fit: initial;               /* never "fill" - that distorts */
  }
  .gmu-menu__item { margin-bottom: 8px !important; }
}

/* ---------- accessibility: honour reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .gmu-menu__item,
  .gmu-menu__img {
    animation: none !important;
    transition: none !important;
    opacity: 1 !important;
    transform: none !important;
  }
  .gmu-menu__item:hover .gmu-menu__img { transform: none; }
  .gmu-menu__item::after { display: none; }
}
</style>
