<!-- =========================================================
     GMU LMS - College menu, auto-fitting iframe
     Generated by generate.py - do not hand-edit.

     Paste into the label or page in HTML view ( < > ).

     HOW THE AUTO-FIT WORKS, WITH NO JAVASCRIPT
     Moodle's purifier strips <script>, so the usual postMessage
     resize handshake is not available. Instead https://mygmu.github.io/MOODLE-MENU/embed.html
     is built so its height is exactly proportional to its width
     (gaps in %, no fixed padding). That makes the frame's correct
     shape a constant, so a single CSS aspect-ratio fits it exactly:

      <=430px   tile 2.400:1   ->  frame 1 : 3.85400
      <=780px   tile 3.200:1   ->  frame 1 : 2.91650
      >=781px   tile 4.000:1   ->  frame 1 : 2.35400

     The wrapper is a CSS CONTAINER, so those breakpoints measure the
     IFRAME's own width. Plain media queries would measure the browser
     viewport, which is wider than the iframe by Moodle's page padding,
     so a phone near a breakpoint would pick the wrong height and leave
     a gap or clip a tile. The @supports fallback below only runs on
     browsers too old for container queries.

     The sizing is ALSO written as inline style attributes. Moodle's
     purifier keeps style="" but may drop <style> blocks; without the
     inline copy the iframe would collapse to the browser default of
     150px. Inline carries the desktop ratio, the <style> block adds
     the phone and tablet bands on top.

     If you change GAP_PCT or the crop ratios, re-run generate.py -
     these numbers are derived, not typed.
     ========================================================= -->

<style>
.gmu-frame {
  container-type: inline-size;
  max-width: 1200px;                /* must match the menu's own cap */
  margin: 0 auto;
}
.gmu-frame__box {
  aspect-ratio: 1 / 2.35400 !important;
  width: 100%;
}
.gmu-frame__box iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

  @container (max-width: 430px) {
    .gmu-frame__box { aspect-ratio: 1 / 3.85400 !important; }
  }
  @container (min-width: 431px) and (max-width: 780px) {
    .gmu-frame__box { aspect-ratio: 1 / 2.91650 !important; }
  }

@supports not (container-type: inline-size) {
    @media (max-width: 430px) {
      .gmu-frame__box { aspect-ratio: 1 / 3.85400 !important; }
    }
    @media (min-width: 431px) and (max-width: 780px) {
      .gmu-frame__box { aspect-ratio: 1 / 2.91650 !important; }
    }
}
</style>

<div class="gmu-frame" style="max-width:1200px;margin:0 auto;container-type:inline-size;">
  <div class="gmu-frame__box" style="width:100%;aspect-ratio:1/3.85400;">
    <iframe src="https://mygmu.github.io/MOODLE-MENU/embed.html"
            title="Gulf Medical University - college menu"
            loading="lazy"
            scrolling="no"
            style="width:100%;height:100%;border:0;display:block;"></iframe>
  </div>
</div>
